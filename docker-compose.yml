version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: postcare_postgres
    restart: always
    environment:
      POSTGRES_DB: postcare_ai
      POSTGRES_USER: postcare_user
      POSTGRES_PASSWORD: postcare_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: postcare_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
